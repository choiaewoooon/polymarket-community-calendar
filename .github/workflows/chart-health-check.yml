name: "Chart Health Check"

# 매일 KST 09:00 (UTC 00:00) + push 시 실행
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "src/render/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  chart-test:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run chart health tests
        id: test
        run: |
          set +e
          OUTPUT=$(npx vitest run tests/chart-health.test.ts --reporter=verbose 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # 결과를 파일로 저장
          echo "$OUTPUT" > test-output.txt

          # 통과/실패 수 파싱
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' || echo "0")
          TOTAL=$((PASSED + FAILED))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          exit $EXIT_CODE

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('test-output.txt', 'utf8');
            const passed = '${{ steps.test.outputs.passed }}';
            const failed = '${{ steps.test.outputs.failed }}';
            const total = '${{ steps.test.outputs.total }}';
            const date = new Date().toISOString().split('T')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 차트 버그 감지 — ${date}`,
              body: `## 차트 Health Check 실패\n\n` +
                `| 항목 | 결과 |\n|------|------|\n` +
                `| 전체 | ${total} |\n| 통과 | ${passed} |\n| **실패** | **${failed}** |\n\n` +
                `### 상세 로그\n\`\`\`\n${output.slice(-3000)}\n\`\`\`\n\n` +
                `> 자동 생성 — chart-health-check workflow`,
              labels: ['bug', 'automated']
            });

      - name: Post success summary
        if: success()
        run: |
          echo "## ✅ 차트 Health Check 통과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 결과 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 전체 | ${{ steps.test.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 통과 | ${{ steps.test.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실패 | ${{ steps.test.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
