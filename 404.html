<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Polymarket Community Calendar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09090b;
            color: #ededf0;
            font-family: 'Outfit', system-ui, sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .wrap { max-width: 420px; }
        .code { font-size: 6rem; font-weight: 700; color: #6366f1; line-height: 1; }
        .msg { margin-top: 1rem; font-size: 1.25rem; color: #9393a0; }
        .home {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            background: #6366f1;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .home:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <p class="msg">페이지를 찾을 수 없습니다</p>
        <a href="/app" class="home">캘린더로 돌아가기</a>
    </div>
</body>
</html>
